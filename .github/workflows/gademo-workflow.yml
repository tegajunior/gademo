name: Class Demo for GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Run Semgrep SAST scan
        run: semgrep scan --config=auto --error .

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'liberica'

      - name: Package with Maven
        run: ./mvnw package
    
      - name: Run tests
        run: ./mvnw test

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Build Docker image
        run: docker build -t ${{ vars.DOCKER_HUB_USERNAME }}/gademo:v${{ github.run_number }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: docker push ${{ vars.DOCKER_HUB_USERNAME }}/gademo:v${{ github.run_number }}
